<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Analytics - Department of Computer Engineering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>

  <div class="offcanvas offcanvas-start sidebar p-3" tabindex="-1" id="mobileNav" aria-label="Navigation">
    <div class="d-flex flex-column h-100">
      <div class="d-flex align-items-center gap-2 px-2 py-3 mb-3 border-bottom border-secondary border-opacity-25">
        <div class="bg-primary text-white rounded p-2 d-flex align-items-center justify-content-center" style="width:36px;height:36px">
          <i class="bi bi-bar-chart-steps fs-5"></i>
        </div>
        <div>
          <h6 class="text-white fw-bold mb-0">Attendance Analytics</h6>
          <span class="text-muted" style="font-size:.75rem">CO Dept</span>
        </div>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <nav class="nav flex-column gap-1" id="nav-mobile"></nav>
    </div>
  </div>

  <div class="d-flex">
    <aside class="sidebar sidebar-desktop d-none d-lg-flex flex-column p-3">
      <div class="d-flex align-items-center gap-2 px-2 py-3 mb-3 border-bottom border-secondary border-opacity-25">
        <div class="bg-primary text-white rounded p-2 d-flex align-items-center justify-content-center" style="width:36px;height:36px">
          <i class="bi bi-bar-chart-steps fs-5"></i>
        </div>
        <div>
          <h6 class="text-white fw-bold mb-0">Attendance Analytics</h6>
          <span class="text-muted" style="font-size:.75rem">CO Dept</span>
        </div>
      </div>

      <nav class="nav flex-column gap-1 flex-grow-1" id="nav-desktop"></nav>

      <div class="p-3 rounded bg-dark bg-opacity-50 border border-secondary border-opacity-25 mt-auto">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-mortarboard text-primary fs-4"></i>
          <div>
            <div class="text-white small fw-bold">Semesters Tracked</div>
            <div class="text-muted" style="font-size:.72rem">CO1 • CO3 • CO5</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="d-flex flex-column flex-grow-1" style="min-width:0;min-height:100vh">
      <header class="top-header d-flex align-items-center justify-content-between px-4 no-print">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-secondary d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Open menu">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div class="d-none d-sm-block">
            <span class="text-muted small">Department: </span>
            <span class="fw-semibold">Computer Engineering</span>
          </div>
        </div>
        <button id="theme-btn" class="btn btn-outline-secondary btn-sm rounded-pill px-3 d-flex align-items-center gap-2"></button>
      </header>

      <main class="p-4 flex-grow-1" id="view"></main>
    </div>
  </div>

  <!-- Manage / Configure modal (used from the Dashboard) -->
  <div class="modal fade" id="manageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-gear-fill me-2"></i>Manage / Configure</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="manage-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger btn-sm" id="manage-reset">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset to defaults
          </button>
          <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/attendance.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
